name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff linting
        run: uv run ruff check src/

      - name: Run ruff formatting check
        run: uv run ruff format --check src/

      - name: Run mypy type checking
        run: uv run mypy src/layercode_gym

  test-imports:
    name: Test Package Imports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install package
        run: uv sync

      - name: Test imports
        run: |
          uv run python -c "from layercode_gym import LayercodeClient, UserSimulator, Persona, Settings"
          uv run python -c "from layercode_gym.callbacks import TurnCallback, ConversationCallback"
          uv run python -c "from layercode_gym.simulator.protocols import UserSimulatorProtocol, TTSEngineProtocol"

  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install package
        run: uv sync

      - name: Test CLI help
        run: |
          uv run layercode-gym --help
          uv run layercode-gym run --help
          uv run layercode-gym api-agents --help

  validate-action:
    name: Validate GitHub Action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run comprehensive CI validation
        run: python scripts/validate_ci.py
