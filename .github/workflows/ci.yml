name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff linting
        run: uv run ruff check src/

      - name: Run ruff formatting check
        run: uv run ruff format --check src/

      - name: Run mypy type checking
        run: uv run mypy src/layercode_gym

  test-imports:
    name: Test Package Imports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install package
        run: uv sync

      - name: Test imports
        run: |
          uv run python -c "from layercode_gym import LayercodeClient, UserSimulator, Persona, Settings"
          uv run python -c "from layercode_gym.callbacks import create_judge_callback"
          uv run python -c "from layercode_gym.simulator import UserSimulatorProtocol, TTSEngineProtocol"

  check-examples:
    name: Validate Example Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check example syntax
        run: |
          for file in examples/*.py; do
            echo "Checking $file"
            uv run python -m py_compile "$file"
          done

      - name: Type check examples
        run: uv run mypy examples/ --ignore-missing-imports
